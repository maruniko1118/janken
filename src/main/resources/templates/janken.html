<!DOCTYPE html>
<html lang="ja">

<head>
  <title>じゃんけんゲーム</title>
</head>

<body>

  <header>
    <h1>じゃんけんゲームへようこそ</h1>
  </header>

  <div id="logout">
    <a href="/logout">ログアウト</a>
  </div>

  <div th:if="${users}">
    <h2>エントリー</h2>
    <ul>
      <!--eachは所謂for each．この場合entryオブジェクトのusersフィールドにあるすべてのデータを一通り表示する
        thが指定されているので[]が不要になる-->
      <li th:each="user : ${users}">[[${user.name}]]</li>
    </ul>
    <h3>現在、[[${users.size()}]]人のユーザーが参加しています</h3>
  </div>

  <div th:if="${username}">
    <h2>Hi [[${username}]]</h2>
  </div>

  <div>
    <a href="/janken/game?hand=グー">グー</a>
    <a href="/janken/game?hand=チョキ">チョキ</a>
    <a href="/janken/game?hand=パー">パー</a>
  </div>

  <div th:if="${result}">
    <p>あなたの手 : [[${playerHand}]]</p>
    <p>相手の手 : [[${cpuHand}]]</p>
    <p>結果 : [[${result}]]</p>
  </div>

</html>
