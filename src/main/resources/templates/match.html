<!DOCTYPE html>
<html lang="ja">

<head>
  <title>じゃんけんゲーム</title>
</head>

<body>

  <header>
    <h1>Match</h1>
  </header>

  <div id="logout">
    <a href="/logout">ログアウト</a>
  </div>

  <div th:if="${user}">
    <h2>
      <span sec:authentication="name"></span> V.S. [[${user.name}]]
    </h2>
  </div>

  <div>
    <a th:href="@{/janken/fight(id=${user.id},hand='グー')}">グー</a>
    <a th:href="@{/janken/fight(id=${user.id},hand='チョキ')}">チョキ</a>
    <a th:href="@{/janken/fight(id=${user.id},hand='パー')}">パー</a>
  </div>

  <div th:if="${result}">
    <p>あなたの手 : [[${playerHand}]]</p>
    <p>相手の手 : [[${opponentHand}]]</p>
    <p>結果 : [[${result}]]</p>
  </div>

  <div>
    <a href="/janken">もどる</a>
  </div>

</html>
